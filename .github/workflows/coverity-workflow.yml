# GitHub Action – Black Duck Security Scan:
#     https://documentation.blackduck.com/bundle/bridge/page/documentation/c_using-github-action.html
# GitHub Prerequisites:
#     https://documentation.blackduck.com/bundle/bridge/page/documentation/c_github-prerequisites.html
# Additional GitHub Configuration:
#     https://documentation.blackduck.com/bundle/bridge/page/documentation/c_additional-github-parameters.html
# Using the Black Duck Security Scan Action with Coverity:
#     https://documentation.blackduck.com/bundle/bridge/page/documentation/c_github-coverity.html
# Using Bridge CLI with Coverity:
#     https://documentation.blackduck.com/bundle/bridge/page/documentation/c_using-bridge-with-coverity-connect.html
name: Coverity Scan
on:
  push:
    branches:
      - main
      - master
      - develop
      - stage
      - release
  pull_request:
    branches:
      - main
      - master
      - develop
      - stage
      - release
  workflow_dispatch: {}
jobs:
  coverity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Coverity Scan
        id: coverity-scan
        uses: blackduck-inc/black-duck-security-scan@v2
        with:
          coverity_url: ${{ vars.COVERITY_URL }}
          coverity_user: ${{ secrets.COVERITY_USER }}
          coverity_passphrase: ${{ secrets.COVERITY_PASSPHRASE }}
