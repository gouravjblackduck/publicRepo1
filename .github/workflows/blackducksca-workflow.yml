# GitHub Action – Black Duck Security Scan:
#     https://blackduck-dev.zoominsoftware.io/bundle/bridge/page/documentation/c_using-github-action.html
# GitHub Prerequisites:
#     https://blackduck-dev.zoominsoftware.io/bundle/bridge/page/documentation/c_github-prerequisites.html
# Additional GitHub Configuration:
#     https://blackduck-dev.zoominsoftware.io/bundle/bridge/page/documentation/c_additional-github-parameters.html
# Using the Black Duck Security Scan Action with Black Duck SCA:
#     https://blackduck-dev.zoominsoftware.io/bundle/bridge/page/documentation/c_github-blackduck.html
# Using Bridge CLI with Black Duck SCA:
#     https://blackduck-dev.zoominsoftware.io/bundle/bridge/page/documentation/c_using-bridge-with-black-duck.html
name: Black Duck Security Scan
on:
  push:
    branches:
      - main
      - master
      - develop
      - stage
      - release
  pull_request:
    branches:
      - main
      - master
      - develop
      - stage
      - release
  workflow_dispatch: {}

# GitHub token permissions for post-scan actions:
# pull-requests: write - Required to add comments to pull requests
# contents: write - Required to create fix pull requests

permissions:
  contents: write
  pull-requests: write
jobs:
  blackducksca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Black Duck Security Scan
        id: black-duck-security-scan
        uses: blackduck-inc/black-duck-security-scan@v2
        with:
          blackducksca_url: ${{ vars.BLACKDUCKSCA_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCKSCA_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          blackducksca_prComment_enabled: true
          blackducksca_fixpr_enabled: true
          blackducksca_reports_sarif_create: true
